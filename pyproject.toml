[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-targeting"
version = "0.1.0"
description = "Typed CPU visual targeting with a fishing task and desktop adapters"
requires-python = ">=3.12"
dependencies = ["numpy", "opencv-python"]

[project.optional-dependencies]
ml = ["ultralytics>=8.3,<9"]
fishing = ["mss", "loguru"]
windows = ["pyautogui; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["visual_targeting*", "fishing*"]
